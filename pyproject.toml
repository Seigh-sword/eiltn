[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eiltn"
version = "0.1.0"
description = "Eiltn: an EIN-dispatched language that runs node waves instead of lines"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
eiltn = "eiltn.cli:main"

[tool.setuptools]
packages = ["eiltn"]
