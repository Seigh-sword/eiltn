[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eiltn"
version = "0.2.0"
description = "eiltn: a jit-dispatched language built on ein node waves"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[project.scripts]
eiltn = "eiltn.cli:main"

[tool.setuptools]
packages = ["eiltn"]
